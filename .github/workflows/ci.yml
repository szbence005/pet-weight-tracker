name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pettracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pettracker
      ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SMTP_HOST: localhost
      SMTP_PORT: '587'
      SMTP_USER: ci-user
      SMTP_PASSWORD: ci-only-dummy-password
      MAIL_FROM: ci@example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc already contains legacy-peer-deps=true
      - run: npm ci

      - run: npm run check
      - run: npm run lint
      - run: npx drizzle-kit push --force
      - run: npm run test:unit -- --run
      - run: npm run build
